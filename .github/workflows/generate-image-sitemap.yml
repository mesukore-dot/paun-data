name: Hourly Split JSON and Generate Sitemap

on:
  push:
    paths:
      - 'videos.json'
  schedule:
    - cron: '0 * * * *' 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process JSON and Sitemap
        run: |
          python -c "
          import json
          import os
          import random
          import re
          from datetime import datetime

          if not os.path.exists('videos.json'):
              print('⚠️ videos.json が見つからないため、処理を安全にスキップします')
              import sys
              sys.exit(0)

          with open('videos.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          def parse_date(date_str):
              if not date_str:
                  return datetime(1970, 1, 1)
              try:
                  clean_str = str(date_str).translate(str.maketrans('０１２３４５６７８９', '0123456789')).strip()
                  clean_str = clean_str.replace('年', '-').replace('月', '-').replace('日', '')
                  clean_str = re.sub(r'\s+', '', clean_str)
                  parts = [p for p in clean_str.split('-') if p]
                  if len(parts) >= 3:
                      return datetime(int(parts), int(parts), int(parts))
                  elif len(parts) == 2:
                      return datetime(int(parts), int(parts), 1)
                  elif len(parts) == 1:
                      return datetime(int(parts), 1, 1)
              except Exception:
                  pass
              return datetime(1970, 1, 1)

          data.sort(key=lambda x: parse_date(x.get('releaseDate', '')), reverse=True)

          site_url = 'https://wpmesucolle.wpx.jp/'
          os.makedirs('data', exist_ok=True)

          now = datetime.now()
          target_single = f'{now.year}年{now.month}月'
          target_double = f'{now.year}年{str(now.month).zfill(2)}月'

          new_arrival_pool = []
          actresses = {}
          pool_vr = []     
          pool_dark = []   
          pool_normal = [] 

          mapping = {
              'toumine_hinako': 'higashimine-hinako',
              'watanabe_hono': 'watanabe-hono',
              'hakata_iroha': 'hakata-iroha'
          }
          for item in data:
              actress_id_field = item.get('actressId')
              if not actress_id_field:
                  continue
              
              target_ids = []
              if isinstance(actress_id_field, list):
                  for x in actress_id_field:
                      target_ids.append(str(x).strip())
              else:
                  target_ids.append(str(actress_id_field).strip())

              g1_url = item.get('gif1Url') or ''
              g2_url = item.get('gif2Url') or ''
              if not g1_url and not g2_url:
                  continue
                  
              title = item.get('title', '')
              xml_title = title.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('\"', '&quot;').replace('\'', '&apos;')

              video_entry = {
                  'title': title,
                  'catchphrase': item.get('catchphrase', ''),
                  'badge': '',
                  'badgeColor': '',
                  'type': item.get('type', ''),
                  'tags': item.get('tags', []),
                  'releaseDate': item.get('releaseDate', ''),
                  'gif1Url': g1_url,
                  'gif2Url': g2_url if g2_url else g1_url,
                  'affiliateUrl': item.get('affiliateUrl', '')
              }

              for a_id in target_ids:
                  slug = mapping.get(a_id, a_id)
                  if slug not in actresses:
                      actresses[slug] = []
                  
                  instance_entry = video_entry.copy()
                  instance_entry['actressId'] = a_id
                  actresses[slug].append({'data': instance_entry, 'xml_title': xml_title})

              r_date = str(video_entry['releaseDate'])
              if target_single in r_date or target_double in r_date:
                  if not any(x['affiliateUrl'] == video_entry['affiliateUrl'] for x in new_arrival_pool):
                      new_arrival_pool.append({
                          'gif2Url': video_entry['gif2Url'],
                          'title': video_entry['title'],
                          'catchphrase': video_entry['catchphrase'],
                          'badge': '',
                          'badgeColor': '',
                          'affiliateUrl': video_entry['affiliateUrl'],
                          'releaseDate': video_entry['releaseDate']
                      })

              v_type = str(video_entry['type']).lower()
              v_tags = [str(t).lower().strip() for t in video_entry['tags']]
              title_lower = title.lower()

              related_item = {
                  'actressIds': target_ids,
                  'gif1Url': g1_url,
                  'gif2Url': g2_url if g2_url else g1_url,
                  'title': title,
                  'catchphrase': video_entry['catchphrase'],
                  'badge': '',
                  'badgeColor': '',
                  'type': video_entry['type'],
                  'tags': video_entry['tags'],
                  'releaseDate': video_entry['releaseDate'],
                  'affiliateUrl': video_entry['affiliateUrl']
              }

              if 'vr' in v_type or 'vr' in v_tags or 'vr' in title_lower:
                  if not any(x['affiliateUrl'] == related_item['affiliateUrl'] for x in pool_vr):
                      pool_vr.append(related_item)
              if 'black' in v_tags:
                  if not any(x['affiliateUrl'] == related_item['affiliateUrl'] for x in pool_dark):
                      pool_dark.append(related_item)
              if not ('vr' in v_type or 'vr' in v_tags or 'vr' in title_lower) and not ('black' in v_tags):
                  if not any(x['affiliateUrl'] == related_item['affiliateUrl'] for x in pool_normal):
                      pool_normal.append(related_item)

          for slug, entries in actresses.items():
              clean_items = [e['data'] for e in entries]
              with open(f'data/{slug}.json', 'w', encoding='utf-8') as f:
                  json.dump(clean_items, f, ensure_ascii=False, indent=2)

          with open('data/new_arrival.json', 'w', encoding='utf-8') as f:
              json.dump(new_arrival_pool, f, ensure_ascii=False, indent=2)

          shuffled_normal = list(pool_normal)
          random.shuffle(shuffled_normal)
          with open('data/related_normal.json', 'w', encoding='utf-8') as f:
              json.dump(shuffled_normal[:250], f, ensure_ascii=False, indent=2)

          shuffled_vr = list(pool_vr)
          random.shuffle(shuffled_vr)
          with open('data/related_vr.json', 'w', encoding='utf-8') as f:
              json.dump(shuffled_vr[:250], f, ensure_ascii=False, indent=2)

          shuffled_dark = list(pool_dark)
          random.shuffle(shuffled_dark)
          with open('data/related_dark.json', 'w', encoding='utf-8') as f:
              json.dump(shuffled_dark[:250], f, ensure_ascii=False, indent=2)

          xml_lines = []
          xml_lines.append('<?xml version=\"1.0\" encoding=\"UTF-8\"?>')
          xml_lines.append('<urlset xmlns=\"http://sitemaps.org\" xmlns:image=\"http://google.com\">')
          for slug, entries in actresses.items():
              xml_lines.append('  <url>')
              xml_lines.append(f'    <loc>{site_url}{slug}/</loc>')
              for e in entries:
                  xml_lines.append('    <image:image>')
                  xml_lines.append(f'      <image:loc>{e[\"data\"][\"gif2Url\"]}</image:loc>')
                  if e['xml_title']:
                      xml_lines.append(f'      <image:title>{e[\"xml_title\"]}</image:title>')
                  xml_lines.append('    </image:image>')
              xml_lines.append('  </url>')
          xml_lines.append('set>')

          final_xml = '\n'.join(xml_lines).replace('\\\"', '\"').replace('set>', '</urlset>')
          with open('sitemap-images.xml', 'w', encoding='utf-8') as f:
              f.write(final_xml)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@://github.com'
          git add sitemap-images.xml data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 リセット版：昨夜の平和な自動仕分けインフラへロールバック' && git push origin HEAD:main)
