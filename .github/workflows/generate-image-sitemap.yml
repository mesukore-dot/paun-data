name: Generate Image Sitemap

on:
  push:
    paths:
      - '**.json' # あなたのJSONファイルが更新された瞬間に自動で動く合図

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Sitemap XML
        run: |
          python -c "
          import json
          import xml.etree.ElementTree as ET
          from xml.dom import minidom

          # 1. あなたのJSONファイルを読み込む（★ファイル名が違っていたらここを直してください）
          with open('videos.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          # 2. Google専用の画像サイトマップの土台を作成
          urlset = ET.Element('urlset', {
              'xmlns': 'http://sitemaps.org',
              'xmlns:image': 'http://google.com'
          })

          # 3. あなたのWebサイトのドメイン（トップURL）
          site_url = 'https://wpmesucolle.wpx.jp'

          # 女優ごとにデータをまとめる
          actresses = {}
          for item in data:
              actress_id = item.get('actressId')
              if not actress_id:
                  continue
              
              actress_id = str(actress_id).trim()
              
              # ★【ここで4人だけの例外を自動変換！】
              # 左側に「JSONのID」、右側に「実際のWordPressのURLの末尾」を書いておきます
              mapping = {
                  'toumine_hinako': 'higashimine-hinako', # 例：ハイフンが違うやつ
                  'watanabe_hono': 'watanabe-hono',          # 例：2がついてるやつ
                  'satsuki_nao': 'satsuki_nao-2',
                  'hakata_iroha': 'hakata-iroha'
              }
              
              # もし例外リストに名前があったら、URL用の文字を自動で書き換える
              slug = mapping.get(actress_id, actress_id)
              
              # お宝GIFのURLを取得
              gif_url = item.get('gif2Url') or item.get('gif1Url')
              if not gif_url:
                  continue
                  
              title = item.get('title', '')
              
              if slug not in actresses:
                  actresses[slug] = []
              actresses[slug].append({'src': gif_url, 'title': title})

          # 4. 女優の個別ページごとに、すべてのGIFをリスト化してXMLに書き込む
          for slug, images in actresses.items():
              url_el = ET.SubElement(urlset, 'url')
              loc_el = ET.SubElement(url_el, 'loc')
              loc_el.text = f'{site_url}{slug}/' # 例外も反映された正しい個別ページURLになる！

              for img in images:
                  img_el = ET.SubElement(url_el, 'image:image')
                  img_src = ET.SubElement(img_el, 'image:loc')
                  img_src.text = img['src']
                  if img['title']:
                      img_title = ET.SubElement(img_el, 'image:title')
                      img_title.text = img['title']

          # 綺麗に整形してファイルに保存
          xml_str = minidom.parseString(ET.tostring(urlset, 'utf-8')).toprettyxml(indent='  ')
          with open('sitemap-images.xml', 'w', encoding='utf-8') as f:
              f.write(xml_str)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          git add sitemap-images.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 画像サイトマップを全自動更新' && git push)
