name: Generate Image Sitemap

on:
  push:
    paths:
      - 'videos.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Sitemap XML
        run: |
          python -c "
          import json

          # 1. 実際のファイルを読み込む
          with open('videos.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          site_url = 'https://wpmesucolle.wpx.jp'

          # 2. 女優ごとにデータをまとめる
          actresses = {}
          for item in data:
              actressId = item.get('actressId')
              if not actressId:
                  continue
              
              actressId = str(actressId)
              
              # 4人の例外を自動変換
              mapping = {
                  'toumine_hinako': 'higashimine-hinako',
                  'watanabe_hono': 'watanabe-hono',
                  'satsuki_nao': 'satsuki_nao-2',
                  'hakata_iroha': 'hakata-iroha'
              }
              
              slug = mapping.get(actressId, actressId)
              
              gif_url = item.get('gif2Url') or item.get('gif1Url')
              if not gif_url:
                  continue
                  
              title = item.get('title', '')
              # XMLでエラーを起こす特殊文字（& や < や >）を安全に変換する
              title = title.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('\"', '&quot;').replace('\'', '&apos;')
              
              if slug not in actresses:
                  actresses[slug] = []
              actresses[slug].append({'src': gif_url, 'title': title})

          # 3. テキスト処理で完璧なXMLを組み立てる（エラーの起きない絶対安全ルート）
          xml_lines = []
          xml_lines.append('<?xml version=\"1.0\" encoding=\"UTF-8\"?>')
          xml_lines.append('<urlset xmlns=\"http://sitemaps.org\" xmlns:image=\"http://google.com\">')

          for slug, images in actresses.items():
              xml_lines.append('  <url>')
              xml_lines.append(f'    <loc>{site_url}{slug}/</loc>')
              for img in images:
                  xml_lines.append('    <image:image>')
                  xml_lines.append(f'      <image:loc>{img[\"src\"]}</image:loc>')
                  if img['title']:
                      xml_lines.append(f'      <image:title>{img[\"title\"]}</image:title>')
                  xml_lines.append('    </image:image>')
              xml_lines.append('  </url>')

          xml_lines.append('</urlset>')

          # 4. ファイルに一気に書き出す
          with open('sitemap-images.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join(xml_lines))
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@://github.com'
          git add sitemap-images.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 画像サイトマップを全自動更新' && git push)
