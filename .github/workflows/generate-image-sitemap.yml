name: Ultimate Hourly Video and Actress Ranking Automator
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Create Python Script
        run: |
          cat << 'EOF' > script.py
          import json, os, random, re
          from datetime import datetime

          def clean_line_to_id(text_line):
              if not text_line: return ''
              return text_line.strip().lower().replace(' ', '').replace(',', '').replace('-', '_')

          fanza_map = {}
          if os.path.exists('ranking_fanza.txt'):
              with open('ranking_fanza.txt', 'r', encoding='utf-8-sig') as f:
                  idx = 1
                  for line in f:
                      clean_id = clean_line_to_id(line)
                      if clean_id:
                          fanza_map[clean_id] = {'text': f'月間{idx}位', 'color': 'gold' if idx <= 10 else 'silver' if idx <= 30 else 'bronze' if idx <= 50 else 'gray', 'num': idx}
                          idx += 1

          mgs_map = {}
          if os.path.exists('ranking_mgs.txt'):
              with open('ranking_mgs.txt', 'r', encoding='utf-8-sig') as f:
                  idx = 1
                  for line in f:
                      clean_id = clean_line_to_id(line)
                      if clean_id:
                          mgs_map[clean_id] = {'text': f'MGS {idx}位', 'color': 'mgs-rank', 'num': idx}
                          idx += 1

          act_data, act_name_map = [], {}
          if os.path.exists('actresses.json'):
              with open('actresses.json', 'r', encoding='utf-8') as f: act_data = json.load(f)
              for act in act_data:
                  act_id = clean_line_to_id(act.get('actressId', ''))
                  if not act_id: continue
                  if act.get('name'): act_name_map[act_id] = act['name']
                  if act_id in mgs_map:
                      act['badge'] = mgs_map[act_id]['text']; act['badgeColor'] = mgs_map[act_id]['color']
                  elif act_id in fanza_map:
                      act['badge'] = fanza_map[act_id]['text']; act['badgeColor'] = fanza_map[act_id]['color']
                  else: act['badge'] = ''; act['badgeColor'] = ''
              with open('actresses.json', 'w', encoding='utf-8') as f: json.dump(act_data, f, ensure_ascii=False, indent=2)

          def parse_date(date_str):
              if not date_str: return datetime(1970, 1, 1)
              try:
                  clean_str = str(date_str).translate(str.maketrans('０１２３４５６７８９', '0123456789')).strip()
                  clean_str = clean_str.replace('年', '-').replace('月', '-').replace('日', '')
                  parts = [p for p in clean_str.split('-') if p]
                  if len(parts) >= 3: return datetime(int(parts[0]), int(parts[1]), int(parts[2]))
                  elif len(parts) == 2: return datetime(int(parts[0]), int(parts[1]), 1)
                  elif len(parts) == 1: return datetime(int(parts[0]), 1, 1)
              except: pass
              return datetime(1970, 1, 1)

          if os.path.exists('videos.json'):
              with open('videos.json', 'r', encoding='utf-8') as f: data = json.load(f)
              site_url = 'https://wpmesucolle.wpx.jp/'
              os.makedirs('data', exist_ok=True)
              genre_dir = os.path.join('data', 'genre')
              os.makedirs(genre_dir, exist_ok=True)
              new_arrival_pool, actresses_map, tags_map = [], {}, {}
              slug_mapping = {'toumine_hinako': 'higashimine-hinako', 'watanabe_hono': 'watanabe-hono', 'hakata_iroha': 'hakata-iroha'}
              # 🌟 実行した瞬間の「今日のローカル日付」を取得（未来日判定用）
              today_date = datetime.now()

              for item in data:
                  actress_id_field = item.get('actressId')
                  if not actress_id_field: continue
                  target_ids = []
                  if isinstance(actress_id_field, list):
                      for x in actress_id_field: target_ids.append(clean_line_to_id(str(x)))
                  else: target_ids.append(clean_line_to_id(str(actress_id_field)))
                  g1_url, g2_url = item.get('gif1Url') or '', item.get('gif2Url') or ''
                  if not g1_url and not g2_url: continue
                  title = item.get('title', '')
                  xml_title = title.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('\"', '&quot;').replace('\'', '&apos;')
                  catchphrase = item.get('catchphrase', '')
                  xml_catch = catchphrase.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('\"', '&quot;').replace('\'', '&apos;')
                  
                  v_badge_text, v_badge_color, best_fanza, best_mgs = '', '', 9999, 9999
                  for a_id in target_ids:
                      if a_id in fanza_map and fanza_map[a_id]['num'] < best_fanza: best_fanza = fanza_map[a_id]['num']
                      if a_id in mgs_map and mgs_map[a_id]['num'] < best_mgs: best_mgs = mgs_map[a_id]['num']
                  if best_mgs <= 100:
                      for a_id in target_ids:
                          if a_id in mgs_map and mgs_map[a_id]['num'] == best_mgs:
                              v_badge_text = mgs_map[a_id]['text']; v_badge_color = 'mgs-rank'; break
                  elif best_fanza <= 100:
                      for a_id in target_ids:
                          if a_id in fanza_map and fanza_map[a_id]['num'] == best_fanza:
                              v_badge_text = fanza_map[a_id]['text']
                              v_badge_color = 'gold' if best_fanza <= 10 else 'silver' if best_fanza <= 30 else 'bronze' if best_fanza <= 50 else 'gray'
                              break

                  video_entry = {
                      'title': title, 'catchphrase': catchphrase, 'badge': v_badge_text, 'badgeColor': v_badge_color,
                      'type': item.get('type', ''), 'tags': item.get('tags', []), 'releaseDate': item.get('releaseDate', ''),
                      'gif1Url': g1_url, 'gif2Url': g2_url if g2_url else g1_url, 'affiliateUrl': item.get('affiliateUrl', ''), 'actressId': target_ids,
                  }

                  # 💡 【重要】発売日が今日より「未来」の予約作品は、すべての配備プールから一律除外する
                  item_release_datetime = parse_date(item.get('releaseDate', ''))
                  if item_release_datetime > today_date:
                      continue

                  for a_id in target_ids:
                      slug = slug_mapping.get(a_id, a_id)
                      if slug not in actresses_map: actresses_map[slug] = []
                      instance_entry = video_entry.copy(); instance_entry['actressId'] = a_id
                      actresses_map[slug].append({'data': instance_entry, 'xml_title': xml_title, 'xml_catch': xml_catch})

                  v_tags = item.get('tags', [])
                  if isinstance(v_tags, list):
                      for raw_tag in v_tags:
                          clean_tag = str(raw_tag).strip().lower()
                          if not clean_tag: continue
                          if clean_tag not in tags_map: tags_map[clean_tag] = []
                          if not any(x['affiliateUrl'] == video_entry['affiliateUrl'] for x in tags_map[clean_tag]):
                              tags_map[clean_tag].append(video_entry)

              for slug, entries in actresses_map.items():
                  clean_items = [e['data'] for e in entries]
                  clean_items.sort(key=lambda x: parse_date(x.get('releaseDate', '')), reverse=True)
                  with open(f'data/{slug}.json', 'w', encoding='utf-8') as f: json.dump(clean_items, f, ensure_ascii=False, indent=2)
    
              fanza_rank_data, mgs_rank_data = [], []
              for act in act_data:
                  if act.get('badge'):
                      act_entry = {'actressId': act.get('actressId', ''), 'badge': act.get('badge', ''), 'badgeColor': act.get('badgeColor', '')}
                      if act.get('badgeColor') == 'mgs-rank': mgs_rank_data.append(act_entry)
                      else: fanza_rank_data.append(act_entry)
              with open('data/ranking_fanza.json', 'w', encoding='utf-8') as f: json.dump(fanza_rank_data, f, ensure_ascii=False, indent=2)
              with open('data/ranking_mgs.json', 'w', encoding='utf-8') as f: json.dump(mgs_rank_data, f, ensure_ascii=False, indent=2)

              # 全データ（今日発売分まで）から重複を弾いて新着プールを生成
              all_videos = []
              for slug, entries in actresses_map.items():
                  for e in entries:
                      if not any(x['affiliateUrl'] == e['data']['affiliateUrl'] for x in all_videos):
                          clean_entry = e['data'].copy()
                          clean_entry.pop('badge', None)
                          clean_entry.pop('badgeColor', None)
                          all_videos.append(clean_entry)
              
              all_videos.sort(key=lambda x: parse_date(x.get('releaseDate', '')), reverse=True)
              new_arrival_pool = all_videos[:200]
              with open('data/new_arrival.json', 'w', encoding='utf-8') as f: json.dump(new_arrival_pool, f, ensure_ascii=False, indent=2)

              for tag_name, items in tags_map.items():
                  clean_tag_items = []
                  for item_entry in items:
                      c_entry = item_entry.copy()
                      c_entry.pop('badge', None)
                      c_entry.pop('badgeColor', None)
                      clean_tag_items.append(c_entry)
                  sample_size = min(len(clean_tag_items), 200)
                  random_sampled_items = random.sample(clean_tag_items, sample_size)
                  random_sampled_items.sort(key=lambda x: parse_date(x.get('releaseDate', '')), reverse=True)
                  file_name = f"{tag_name}_tag.json"
                  file_path = os.path.join(genre_dir, file_name)
                  with open(file_path, 'w', encoding='utf-8') as f: json.dump(random_sampled_items, f, ensure_ascii=False, indent=2)
    
              xml_lines = []
              xml_lines.append('<?xml version="1.0" encoding="UTF-8"?>')
              xml_lines.append('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:image="http://www.google.com/schemas/sitemap-image/1.1">')
              for slug in actresses_map.keys():
                  xml_lines.append('  <url>')
                  xml_lines.append(f'    <loc>{site_url}{slug}</loc>')
                  for e in actresses_map[slug]:
                      if e["data"]["gif1Url"]:
                          xml_lines.append('    <image:image>')
                          xml_lines.append(f'      <image:loc>{e["data"]["gif1Url"]}</image:loc>')
                          xml_lines.append('    </image:image>')
                      if e["data"]["gif2Url"] and e["data"]["gif2Url"] != e["data"]["gif1Url"]:
                          xml_lines.append('    <image:image>')
                          xml_lines.append(f'      <image:loc>{e["data"]["gif2Url"]}</image:loc>')
                          xml_lines.append('    </image:image>')
                  xml_lines.append('  </url>')
              xml_lines.append('</urlset>')
              final_xml = '\n'.join(xml_lines).replace('\\"', '"')
              with open(os.path.join(os.getcwd(), 'sitemap-images.xml'), 'w', encoding='utf-8') as f: f.write(final_xml)
          EOF
          python script.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@://github.com'
          git add "$GITHUB_WORKSPACE/sitemap-images.xml" data/*.json data/genre/*.json actresses.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m '🤖 超融合：今日より未来の作品を除外する本番自動スケジュールインフラ配備完了' && git push origin HEAD:main)
